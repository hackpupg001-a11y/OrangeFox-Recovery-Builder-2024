name: Build EAS Fault Insight (Rust) từ link Google Drive

# Cách dùng: GitHub repo -> tab Actions -> "Build EAS Fault Insight (Rust) từ link Google Drive"
#            -> Run workflow -> dán link Google Drive vào ô drive_url -> Run.
# Lưu file này vào repo tại: .github/workflows/build-rust-from-drive.yml

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Link Google Drive tới file .zip (hoặc thư mục) chứa source. Chia sẻ: 'Bất kỳ ai có đường liên kết'"
        required: true
        type: string
      target:
        description: "Build cho hệ điều hành nào"
        required: true
        type: choice
        default: windows
        options:
          - windows
          - linux
          - both

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.target == 'both' && '["windows-latest","ubuntu-latest"]' || (inputs.target == 'linux' && '["ubuntu-latest"]' || '["windows-latest"]')) }}

    steps:
      - name: Cài Python (để tải từ Google Drive)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tải source từ Google Drive
        shell: bash
        env:
          DRIVE_URL: ${{ inputs.drive_url }}   # truyền qua biến môi trường, không chèn thẳng vào script
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade gdown
          rm -rf _dl && mkdir -p _dl
          ok=0
          for attempt in 1 2 3; do
            echo "== Lần tải $attempt =="
            if [[ "$DRIVE_URL" == *"/folders/"* ]]; then
              gdown --folder --remaining-ok "$DRIVE_URL" -O _dl && ok=1 && break
            else
              gdown --fuzzy "$DRIVE_URL" -O _dl/source.zip && ok=1 && break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Không tải được từ Google Drive. Kiểm tra: (1) link đã chia sẻ 'Bất kỳ ai có đường liên kết' chưa, (2) nếu báo 'Too many users' thì thử lại sau ít phút, (3) dán đúng link file .zip hoặc thư mục."
            exit 1
          fi
          ls -la _dl

      - name: Giải nén và tìm Cargo.toml
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _src && mkdir -p _src
          shopt -s nullglob
          zips=(_dl/*.zip)
          if (( ${#zips[@]} )); then
            for z in "${zips[@]}"; do
              python -m zipfile -t "$z" >/dev/null
              python -m zipfile -e "$z" _src
            done
          else
            cp -r _dl/. _src/
          fi
          # lấy Cargo.toml nằm nông nhất (gói zip thường có 1 thư mục bọc ngoài)
          CARGO=$(find _src -name Cargo.toml -not -path '*/target/*' | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$CARGO" ]; then
            echo "::error::Không thấy Cargo.toml trong source đã giải nén. Nội dung:"
            find _src -maxdepth 3 | head -60
            exit 1
          fi
          DIR=$(dirname "$CARGO")
          echo "Thư mục project: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: Cài Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cài NASM (Windows, cần cho một số thư viện TLS)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Cache thư viện Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ steps.locate.outputs.dir }} -> target"

      - name: Build release
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          rustc --version
          cargo --version
          cargo build --release

      - name: Đóng gói
        id: pack
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          NAME=$(cargo metadata --no-deps --format-version 1 | python -c "import sys,json; d=json.load(sys.stdin); print([t['name'] for p in d['packages'] for t in p['targets'] if 'bin' in t['kind']][0])")
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          PKG="eas-fault-insight-${RUNNER_OS}"
          OUT="$GITHUB_WORKSPACE/dist/$PKG"
          rm -rf "$GITHUB_WORKSPACE/dist" && mkdir -p "$OUT"
          cp "target/release/${NAME}${EXT}" "$OUT/"
          # file chạy cần đi kèm (index106.html được đọc lúc chạy, không nhúng vào exe)
          for item in index106.html templates data uploads README.md; do
            if [ -e "$item" ]; then cp -r "$item" "$OUT/"; fi
          done
          # không đóng gói khoá / dữ liệu nhạy cảm nếu lỡ nằm trong source
          rm -f "$OUT/data/.secret_key" "$OUT/data/app_key.txt" "$OUT/data/users_local.json"
          rm -rf "$OUT/data/.eas_cache"
          mkdir -p "$OUT/data" "$OUT/uploads/specialid"

          if [ "$RUNNER_OS" = "Windows" ]; then
            cat > "$OUT/start_windows.bat" <<EOF
          @echo off
          chcp 65001 >nul
          if "%EAS_DB_HOST%"=="" set EAS_DB_HOST=127.0.0.1
          if "%EAS_DB_PORT%"=="" set EAS_DB_PORT=3306
          if "%EAS_DB_USER%"=="" set EAS_DB_USER=root
          if "%EAS_DB_NAME%"=="" set EAS_DB_NAME=ami_cell
          if "%EAS_PORT%"=="" set EAS_PORT=50125
          rem Điền mật khẩu SQL của bạn vào dòng dưới (hoặc đặt biến môi trường EAS_DB_PASSWORD):
          if "%EAS_DB_PASSWORD%"=="" set EAS_DB_PASSWORD=
          ${NAME}.exe
          pause
          EOF
          else
            cat > "$OUT/start_linux.sh" <<EOF
          #!/usr/bin/env bash
          cd "\$(dirname "\$0")"
          export EAS_DB_HOST="\${EAS_DB_HOST:-127.0.0.1}"
          export EAS_DB_PORT="\${EAS_DB_PORT:-3306}"
          export EAS_DB_USER="\${EAS_DB_USER:-root}"
          export EAS_DB_NAME="\${EAS_DB_NAME:-ami_cell}"
          export EAS_PORT="\${EAS_PORT:-50125}"
          # export EAS_DB_PASSWORD="điền mật khẩu SQL"
          ./${NAME}
          EOF
            chmod +x "$OUT/start_linux.sh" "$OUT/${NAME}"
          fi

          echo "name=$PKG" >> "$GITHUB_OUTPUT"
          echo "### Build xong: $PKG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Binary: \`${NAME}${EXT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tải ở mục **Artifacts** cuối trang run này (giữ 30 ngày)." >> "$GITHUB_STEP_SUMMARY"
          ls -la "$OUT"

      - name: Tải file đã build lên (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: dist/${{ steps.pack.outputs.name }}
          retention-days: 30
          if-no-files-found: error
