name: Build EAS Fault Insight (Rust) từ link Google Drive

# Bản 1 exe: giao diện, luật mặc định, khoá app, tài khoản SQL, cert TLS được nhúng vào exe (build.rs),
# mã hoá AES-256-GCM, khoá chia mảnh. JS phía trình duyệt (trong index106.html) được obfuscate
# trước khi nhúng, để không ai đọc thẳng logic JS bằng F12 -> View source.
# Secrets tuỳ chọn (Settings -> Secrets and variables -> Actions), nếu không có thì build.rs lấy từ file trong source:
#   EAS_APP_KEY (hex)  EAS_DB_USER  EAS_DB_PASS  EAS_TLS_CERT (PEM)  EAS_TLS_KEY (PEM)

# Cách dùng: GitHub repo -> tab Actions -> "Build EAS Fault Insight (Rust) từ link Google Drive"
#            -> Run workflow -> dán link Google Drive vào ô drive_url -> Run.
# Lưu file này vào repo tại: .github/workflows/build-rust-from-drive.yml

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Link Google Drive tới file .zip (hoặc thư mục) chứa source. Chia sẻ: 'Bất kỳ ai có đường liên kết'"
        required: true
        type: string
      target:
        description: "Build cho hệ điều hành nào"
        required: true
        type: choice
        default: windows
        options:
          - windows
          - linux
          - both
      obfuscate_js:
        description: "Obfuscate JS trong index HTML trước khi nhúng vào exe"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.target == 'both' && '["windows-latest","ubuntu-latest"]' || (inputs.target == 'linux' && '["ubuntu-latest"]' || '["windows-latest"]')) }}

    steps:
      - name: Cài Python (để tải từ Google Drive và xử lý HTML)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tải source từ Google Drive
        shell: bash
        env:
          DRIVE_URL: ${{ inputs.drive_url }}   # truyền qua biến môi trường, không chèn thẳng vào script
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade gdown
          rm -rf _dl && mkdir -p _dl
          # Lấy ID file từ link: .../file/d/<ID>/view  hoặc  ...open?id=<ID>  (không dùng --fuzzy vì gdown bản mới đã bỏ)
          FILE_ID=""
          if [[ "$DRIVE_URL" =~ /d/([A-Za-z0-9_-]+) ]]; then FILE_ID="${BASH_REMATCH[1]}"; fi
          if [ -z "$FILE_ID" ] && [[ "$DRIVE_URL" =~ [?\&]id=([A-Za-z0-9_-]+) ]]; then FILE_ID="${BASH_REMATCH[1]}"; fi
          ok=0
          for attempt in 1 2 3; do
            echo "== Lần tải $attempt =="
            if [[ "$DRIVE_URL" == *"/folders/"* ]]; then
              gdown --folder "$DRIVE_URL" -O _dl && ok=1 && break
            elif [ -n "$FILE_ID" ]; then
              echo "File ID: $FILE_ID"
              gdown "https://drive.google.com/uc?id=${FILE_ID}" -O _dl/source.zip && ok=1 && break
            else
              echo "::error::Không đọc được ID file từ link. Dán link dạng https://drive.google.com/file/d/<ID>/view"
              exit 1
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Không tải được từ Google Drive. Kiểm tra: (1) link đã chia sẻ 'Bất kỳ ai có đường liên kết' chưa, (2) nếu báo 'Too many users' thì thử lại sau ít phút, (3) dán đúng link file .zip hoặc thư mục."
            exit 1
          fi
          ls -la _dl

      - name: Giải nén và tìm Cargo.toml
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _src && mkdir -p _src
          shopt -s nullglob
          zips=(_dl/*.zip)
          if (( ${#zips[@]} )); then
            for z in "${zips[@]}"; do
              python -m zipfile -t "$z" >/dev/null
              python -m zipfile -e "$z" _src
            done
          else
            cp -r _dl/. _src/
          fi
          # lấy Cargo.toml nằm nông nhất (gói zip thường có 1 thư mục bọc ngoài)
          CARGO=$(find _src -name Cargo.toml -not -path '*/target/*' | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$CARGO" ]; then
            echo "::error::Không thấy Cargo.toml trong source đã giải nén. Nội dung:"
            find _src -maxdepth 3 | head -60
            exit 1
          fi
          DIR=$(dirname "$CARGO")
          echo "Thư mục project: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: Cài Node.js (để obfuscate JS)
        if: ${{ inputs.obfuscate_js }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Obfuscate JS trong index HTML trước khi nhúng
        if: ${{ inputs.obfuscate_js }}
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          npm install --no-save javascript-obfuscator@4

          cat > _obfuscate_inline_js.py <<'PYEOF'
          import re, subprocess, pathlib, sys

          # Giống đúng thứ tự ưu tiên "first_file" trong build.rs: chỉ file ĐẦU TIÊN
          # tồn tại trong nhóm index HTML mới được build.rs nhúng vào exe, nên ở đây
          # cũng chỉ obfuscate đúng 1 file đó (không obfuscate các bản trùng không dùng tới).
          html_group = [
              "index106.html", "index100.html", "index.html",
              "templates/index.html", "templates/index100.html",
          ]
          targets = []
          for name in html_group:
              if pathlib.Path(name).is_file():
                  targets.append(name)
                  break
          if pathlib.Path("index_script.js").is_file():
              targets.append("index_script.js")

          if not targets:
              print("Khong tim thay index HTML / index_script.js de obfuscate, bo qua buoc nay.")
              sys.exit(0)

          OBF_BIN = str((pathlib.Path("node_modules") / ".bin" / "javascript-obfuscator").resolve())

          OBF_ARGS = [
              "--compact", "true",
              "--control-flow-flattening", "true",
              "--control-flow-flattening-threshold", "0.75",
              "--dead-code-injection", "true",
              "--dead-code-injection-threshold", "0.3",
              "--string-array", "true",
              "--string-array-encoding", "rc4",
              "--string-array-threshold", "0.8",
              "--split-strings", "true",
              "--split-strings-chunk-length", "8",
              "--transform-object-keys", "true",
              "--numbers-to-expressions", "true",
              "--simplify", "true",
              "--identifier-names-generator", "hexadecimal",
              # Giữ false: nhiều hàm JS được HTML gọi qua onclick="ten_ham(...)".
              # Đổi tên biến/hàm toàn cục sẽ làm những nút bấm đó hỏng.
              "--rename-globals", "false",
              # Tắt self-defending / debug-protection: hai cái này hay làm treo tab
              # khi người vận hành mở F12 để debug lỗi giao diện thật, không đáng đánh đổi
              # cho một công cụ nội bộ. Vẫn giữ control-flow-flattening + string-array
              # để không ai đọc thẳng logic bằng View source.
              "--self-defending", "false",
              "--debug-protection", "false",
          ]

          def obfuscate_file(path: pathlib.Path):
              tmp_out = path.with_suffix(path.suffix + ".obf.js")
              cmd = [OBF_BIN, str(path), "--output", str(tmp_out)] + OBF_ARGS
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode != 0 or not tmp_out.is_file():
                  print(f"::warning::Obfuscate '{path}' that bai, giu nguyen file goc.")
                  print(r.stderr[-2000:])
                  return None
              code = tmp_out.read_text(encoding="utf-8")
              tmp_out.unlink(missing_ok=True)
              return code

          SCRIPT_RE = re.compile(r'(<script(?![^>]*\bsrc=)[^>]*>)(.*?)(</script>)', re.DOTALL | re.IGNORECASE)

          total_blocks = [0]  # dung list thay vi int de khoi can 'nonlocal'
                              # ('nonlocal' chi hoat dong trong ham long nhau,
                              # nhung vong lap nay dang o muc module -> SyntaxError)
          for name in targets:
              p = pathlib.Path(name)
              if name.endswith(".js"):
                  code = p.read_text(encoding="utf-8")
                  if not code.strip():
                      continue
                  tmp_in = p.with_suffix(".src.js")
                  tmp_in.write_text(code, encoding="utf-8")
                  obf = obfuscate_file(tmp_in)
                  tmp_in.unlink(missing_ok=True)
                  if obf is not None:
                      p.write_text(obf, encoding="utf-8")
                      print(f"Da obfuscate {name}")
                  continue

              html = p.read_text(encoding="utf-8")

              def repl(m):
                  open_tag, code, close_tag = m.group(1), m.group(2), m.group(3)
                  if not code.strip():
                      return m.group(0)
                  tmp_in = pathlib.Path(f"_obf_block_{total_blocks[0]}.js")
                  tmp_in.write_text(code, encoding="utf-8")
                  obf = obfuscate_file(tmp_in)
                  tmp_in.unlink(missing_ok=True)
                  if obf is None:
                      return m.group(0)
                  total_blocks[0] += 1
                  return open_tag + "\n" + obf + "\n" + close_tag

              new_html = SCRIPT_RE.sub(repl, html)
              p.write_text(new_html, encoding="utf-8")
              print(f"Da obfuscate cac khoi <script> trong {name}")

          print(f"Tong so khoi JS da obfuscate: {total_blocks[0]}")
          PYEOF

          python3 _obfuscate_inline_js.py
          rm -f _obfuscate_inline_js.py

      - name: Cài Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Ghim zip 2.5.0 (calamine 0.26 lỗi biên dịch với zip >= 2.6)
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          if grep -q 'name = "calamine"' Cargo.lock; then
            cargo update -p zip --precise 2.5.0 || echo "Bỏ qua: không ghim được zip (có thể Cargo.toml đã tự ghim)"
          fi
          grep -A1 'name = "zip"' Cargo.lock || true

      - name: Cài NASM (Windows, cần cho một số thư viện TLS)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Cache thư viện Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ steps.locate.outputs.dir }} -> target"

      - name: Build release (nhúng dữ liệu vào exe)
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          EAS_BUILD_APP_KEY: ${{ secrets.EAS_APP_KEY }}
          EAS_BUILD_DB_USER: ${{ secrets.EAS_DB_USER }}
          EAS_BUILD_DB_PASS: ${{ secrets.EAS_DB_PASS }}
          EAS_BUILD_TLS_CERT: ${{ secrets.EAS_TLS_CERT }}
          EAS_BUILD_TLS_KEY: ${{ secrets.EAS_TLS_KEY }}
        run: |
          rustc --version
          cargo --version
          cargo build --release

      - name: Đóng gói
        id: pack
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          NAME=$(cargo metadata --no-deps --format-version 1 | python -c "import sys,json; d=json.load(sys.stdin); print([t['name'] for p in d['packages'] for t in p['targets'] if 'bin' in t['kind']][0])")
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          PKG="eas-fault-insight-${RUNNER_OS}"
          OUT="$GITHUB_WORKSPACE/dist/$PKG"
          rm -rf "$GITHUB_WORKSPACE/dist" && mkdir -p "$OUT"
          cp "target/release/${NAME}${EXT}" "$OUT/"
          # giữ Cargo.lock đã build thành công: commit file này vào source để các lần build sau ra đúng phiên bản thư viện
          if [ -f Cargo.lock ]; then cp Cargo.lock "$OUT/Cargo.lock.buildok"; fi
          # Giao diện / luật / khoá / cert đã nằm trong exe -> chỉ đóng gói exe + script chạy.
          # data/ và uploads/ sẽ tự tạo lúc chạy (cache, .secret_key, users_local.json, specialid).

          if [ "$RUNNER_OS" = "Windows" ]; then
            cat > "$OUT/start_windows.bat" <<EOF
          @echo off
          chcp 65001 >nul
          if "%EAS_DB_HOST%"=="" set EAS_DB_HOST=127.0.0.1
          if "%EAS_DB_PORT%"=="" set EAS_DB_PORT=3306
          if "%EAS_DB_USER%"=="" set EAS_DB_USER=root
          if "%EAS_DB_NAME%"=="" set EAS_DB_NAME=ami_cell
          if "%EAS_PORT%"=="" set EAS_PORT=50125
          rem Tài khoản/mật khẩu SQL đã nhúng trong exe; đặt EAS_DB_USER / EAS_DB_PASSWORD ở đây nếu muốn ghi đè.
          ${NAME}.exe
          pause
          EOF
          else
            cat > "$OUT/start_linux.sh" <<EOF
          #!/usr/bin/env bash
          cd "\$(dirname "\$0")"
          export EAS_DB_HOST="\${EAS_DB_HOST:-127.0.0.1}"
          export EAS_DB_PORT="\${EAS_DB_PORT:-3306}"
          export EAS_DB_USER="\${EAS_DB_USER:-root}"
          export EAS_DB_NAME="\${EAS_DB_NAME:-ami_cell}"
          export EAS_PORT="\${EAS_PORT:-50125}"
          # tài khoản/mật khẩu SQL đã nhúng trong exe; export EAS_DB_USER / EAS_DB_PASSWORD nếu muốn ghi đè
          ./${NAME}
          EOF
            chmod +x "$OUT/start_linux.sh" "$OUT/${NAME}"
          fi

          echo "name=$PKG" >> "$GITHUB_OUTPUT"
          echo "### Build xong: $PKG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Binary: \`${NAME}${EXT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tải ở mục **Artifacts** cuối trang run này (giữ 30 ngày)." >> "$GITHUB_STEP_SUMMARY"
          ls -la "$OUT"

      - name: Tải file đã build lên (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: dist/${{ steps.pack.outputs.name }}
          retention-days: 30
          if-no-files-found: error
